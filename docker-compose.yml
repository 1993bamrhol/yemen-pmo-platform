services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yemen_pmo
      POSTGRES_USER: yemen_pmo
      POSTGRES_PASSWORD: yemen_pmo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/yemen_pmo
      SPRING_DATASOURCE_USERNAME: yemen_pmo
      SPRING_DATASOURCE_PASSWORD: yemen_pmo
    depends_on:
      - database
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
