server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  application:
    name: yemen-pmo-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yemen_pmo}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:yemen_pmo}
    password: ${SPRING_DATASOURCE_PASSWORD:yemen_pmo}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    expiration-ms: ${SECURITY_JWT_EXPIRATION_MS:86400000}

bootstrap:
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@pmo.gov.ye}
    password: ${ADMIN_PASSWORD:}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

features:
  unified-content-read:
    enabled: ${FEATURE_UNIFIED_CONTENT_READ_ENABLED:false}
  unified-content-backfill-apply:
    enabled: ${FEATURES_UNIFIED_CONTENT_BACKFILL_APPLY_ENABLED:false}
  unified-content-compatibility:
    news-enabled: ${FEATURES_UNIFIED_CONTENT_COMPATIBILITY_NEWS_ENABLED:false}
    announcements-enabled: ${FEATURES_UNIFIED_CONTENT_COMPATIBILITY_ANNOUNCEMENTS_ENABLED:false}
    decisions-enabled: ${FEATURES_UNIFIED_CONTENT_COMPATIBILITY_DECISIONS_ENABLED:false}
    documents-enabled: ${FEATURES_UNIFIED_CONTENT_COMPATIBILITY_DOCUMENTS_ENABLED:false}
